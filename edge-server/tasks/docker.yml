- name: Uninstall NVIDIA container toolkit if other version installed
  when:
    - nvidia_docker
    - nvidia_ctk_server_version != nvidia_ctk_version
  become: true
  with_items:
    - "libnvidia-container*"
    - "nvidia-container-*"
  ansible.builtin.apt:
    name: "{{ item }}"
    state: absent

- name: Install NVIDIA container toolkit
  when:
    - (not nvidia_docker) or (nvidia_ctk_server_version != nvidia_ctk_version)
  become: true
  with_items:
    - "libnvidia-container1:{{ deb_arch }}={{ nvidia_ctk_version }}-1"
    - "libnvidia-container-tools={{ nvidia_ctk_version }}-1"
    - "nvidia-container-toolkit-base={{ nvidia_ctk_version }}-1"
    - "nvidia-container-toolkit={{ nvidia_ctk_version }}-1"
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    allow_downgrade: true
    update_cache: true

- name: Hold NVIDIA Container Toolkit package to prevent updates
  become: true
  with_items:
    - "libnvidia-container1:{{ deb_arch }}"
    - "libnvidia-container-tools"
    - "nvidia-container-toolkit-base"
    - "nvidia-container-toolkit"
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold

- name: Configure docker daemon defaults
  when:
    - (not nvidia_docker) or (nvidia_ctk_server_version != nvidia_ctk_version)
  become: true
  notify:
    - Restart docker daemon
  ansible.builtin.copy:
    src: "files/etc/docker/daemon.{{ deb_arch }}.json"
    dest: /etc/docker/daemon.json
    mode: "0644"

- name: Check if reboot is required
  changed_when: reboot_required.stat.exists
  notify: Reboot
  register: reboot_required
  ansible.builtin.stat:
    get_checksum: false
    path: /var/run/reboot-required

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
