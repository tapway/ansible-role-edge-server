- name: Update apt cache and install prerequisite packages for docker
  become: true
  when: not docker_version
  with_items: "{{ docker_prerequisite_packages }}"
  ansible.builtin.apt:
    name: "{{ item }}"
    update_cache: true
    cache_valid_time: "{{ cache_valid_time }}"

- name: Create keyrings directory if it does not exist
  become: true
  when: not docker_version
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '755'

- name: Download docker gpg key
  become: true
  when: not docker_version
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /tmp/docker.gpg
    mode: '644'

- name: Add gpg key to keyrings
  become: true
  when: not docker_version
  ansible.builtin.command:
    cmd: gpg --dearmor -o /etc/apt/keyrings/docker.gpg /tmp/docker.gpg
    creates: /etc/apt/keyrings/docker.gpg

- name: Ensure docker.gpg has read permission
  become: true
  when: not docker_version
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.gpg
    mode: '644'

- name: Add docker repository to apt sources
  become: true
  when: not docker_version
  ansible.builtin.apt_repository:
    state: present  # default
    repo: "deb [arch={{ deb_arch }} signed-by=/etc/apt/keyrings/docker.gpg]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker

- name: Install docker packages
  become: true
  when: not docker_version
  notify:
    - Restart docker daemon
  with_items:
    - containerd.io
    - docker-buildx-plugin
    - docker-ce
    - docker-ce-cli
  ansible.builtin.apt:
    name: "{{ item }}"
    cache_valid_time: "{{ cache_valid_time }}"

- name: Create docker group
  become: true
  ansible.builtin.group:
    name: docker
    state: present

- name: Add user to the docker group
  become: true
  ansible.builtin.user:
    append: true
    groups: docker
    name: "{{ ansible_user_id }}"

- name: Download NVIDIA GPG key
  when:
    - (not nvidia_docker) or (nvidia_ctk_server_version != nvidia_ctk_version)
  become: true
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /tmp/nvidia-gpgkey
    mode: '0644'

- name: Convert NVIDIA GPG key to keyring format
  when:
    - (not nvidia_docker) or (nvidia_ctk_server_version != nvidia_ctk_version)
  become: true
  ansible.builtin.command:
    cmd: gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg /tmp/nvidia-gpgkey
  args:
    creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg

- name: Remove temporary NVIDIA GPG key file
  when:
    - (not nvidia_docker) or (nvidia_ctk_server_version != nvidia_ctk_version)
  become: true
  ansible.builtin.file:
    path: /tmp/nvidia-gpgkey
    state: absent

- name: Download NVIDIA container toolkit list file
  when:
    - (not nvidia_docker) or (nvidia_ctk_server_version != nvidia_ctk_version)
  become: true
  ansible.builtin.get_url:
    url: "https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list"
    dest: "/etc/apt/sources.list.d/nvidia-container-toolkit.list"
    mode: "0644"

- name: Update the NVIDIA container toolkit list with the GPG key
  when:
    - (not nvidia_docker) or (nvidia_ctk_server_version != nvidia_ctk_version)
  become: true
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/nvidia-container-toolkit.list
    regexp: '^deb https://'
    replace: 'deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://'
    backup: true

