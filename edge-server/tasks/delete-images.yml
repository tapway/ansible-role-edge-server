- name: Create imagedelete dir
  become: true
  register: imagedelete
  ansible.builtin.file:
    path: /root/imagedelete
    state: directory
    mode: '0755'

- name: Create empty files to root  # noqa: no-handler
  become: true
  when: imagedelete is changed
  ansible.builtin.file:
    path: /root/imagedelete/{{ item }}
    state: touch
    mode: '0755'
  with_items:
    - del.sh

- name: Create log file for cronjob
  become: true
  ansible.builtin.file:
    path: /var/log/samurai-cron.log
    state: touch
    mode: '0666'
    modification_time: preserve
    access_time: preserve

- name: Copy imagedelete file content
  become: true
  # when: imagedelete is changed
  ansible.builtin.copy:
    dest: /root/imagedelete/del.sh
    content: |
      #!/bin/bash

      exec 2>&1 &>>/var/log/samurai-cron.log

      path="/images"
      config_file="/config/middleware_config.json"
      default_days=7
      default_size=20

      # Get retention days from config
      if [ -f "$config_file" ] && jq -e ".data_retention" "$config_file" >/dev/null; then
        days=$(jq -r '.data_retention.day_limit // empty' "$config_file")
      fi
      days=${days:-$default_days}

      echo "[$(date "+%Y %b %-d %a %I:%M:%S")] Deleting files older than $days days..."
      find "$path" -ignore_readdir_race -type f -mtime +$days -delete

      # Get threshold size from config
      if [ -f "$config_file" ] && jq -e ".data_retention" "$config_file" >/dev/null; then
        size=$(jq -r '.data_retention.size_limit // empty' "$config_file")
      fi
      size=${size:-$default_size}

      threshold_size=$(echo "$size * 1024^3" | bc | awk '{printf "%.0f", $0}')
      directory_size=$(du -sb "$path" | awk '{print $1}')
      directory_size_gb=$(echo "scale=2; $directory_size / 1024^3" | bc)

      if [ "$directory_size" -le "$threshold_size" ]; then
        echo "[$(date "+%Y %b %-d %a %I:%M:%S")] Size within limits ($directory_size_gb GB). No action needed."
        exit 0
      fi

      echo "[$(date "+%Y %b %-d %a %I:%M:%S")] Size exceeded: $directory_size_gb GB > $size GB. Deleting oldest files..."

      # Generate sorted file list (oldest first)
      tempfile=$(mktemp)
      find "$path" -ignore_readdir_race -type f -printf '%T@ %s %p\0' > "$tempfile"
      sort -zn -o "$tempfile" "$tempfile"  # Null-delimited sort by timestamp

      # Delete files until under threshold
      target_size=$((directory_size - threshold_size))
      deleted_size=0

      while IFS= read -r -d '' record && [ "$deleted_size" -lt "$target_size" ]; do
        # Extract size and path from null-delimited record
        size_bytes="${record%% *}"       # First field is timestamp
        file_path="${record#* }"         # Remove timestamp
        size_bytes="${file_path%% *}"    # Next field is size
        file_path="${file_path#* }"      # Remainder is path

        if [ -f "$file_path" ]; then
          rm -f "$file_path" && deleted_size=$((deleted_size + size_bytes))
        fi
      done < "$tempfile"
      rm -f "$tempfile"

      # Final size check
      new_size=$(du -sb "$path" | awk '{print $1}')
      new_size_gb=$(echo "scale=2; $new_size / 1024^3" | bc)
      echo "[$(date "+%Y %b %-d %a %I:%M:%S")] Deletion completed. Final size: $new_size_gb GB."
    mode: '0755'

# Run every 3 hour, everyday
- name: Run cronjob
  become: true
  ansible.builtin.cron:
    name: "clean_images_folder"
    minute: "00"
    hour: "*/3"
    day: "*"
    month: "*"
    state: present
    job: bash /root/imagedelete/del.sh
