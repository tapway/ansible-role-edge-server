# Mappings for facts
deb_architecture:
  "aarch64": "arm64"
  "x86_64": "amd64"

gg_architecture:
  "aarch64": "aarch64"
  "x86_64": "x86-64"

# Edge Server environment variables
manager_image: gotapway/edge-server-manager
manager_tag: 1.9.0
manager_logging_level: INFO
manager_mqtt_port: 8883
frp_server_ip: edgev2.gotapway.com
frp_token: T@pw4yANPR!

github_token: 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  # pragma: allowlist secret

# Default packages and apt parameters
cache_valid_time: 3600

apt_packages:
  - apt-utils
  - avahi-daemon
  - build-essential
  - ca-certificates
  - cmake
  - curl
  - gnupg
  - jq
  - lsb-release
  - make
  - net-tools
  - python3
  - python3-pip  # not available in python3.12
  - ubuntu-drivers-common
  - wget
  - unzip

awscli_version: "2.17.13"
frp_version: "0.60.0"

docker_prerequisite_packages:
  - ca-certificates
  - curl
# Docker compose version (>v2.24.5 will have extends cannot be used with depends_on error)
docker_compose_version: "v2.24.5"

# Nvidia defaults
nvidia_driver_version: 550
nvidia_docker_repo_base_url: "https://nvidia.github.io/nvidia-docker"
nvidia_docker_repo_gpg_url: "{{ nvidia_docker_repo_base_url }}/gpgkey"
nvidia_ctk_version: "1.16.2"

# Greengrass service defaults
greengrass_group: ggc_group
greengrass_user: ggc_user
greengrass_version: "1.11.6"

cpu_limit_pct: 90
ram_limit_pct: 90

# Monitoring defaults
netdata_version: "1.47"
jtop_version: "4.2.12"

netdata_slack_webhook_url: ""
netdata_slack_recipient: ""

netdata_ram_usage_warn: "80"
netdata_ram_usage_crit: "90"

netdata_postgresql_dsn: ""
netdata_rabbitmq_url: ""
netdata_redis_address: ""

share_dirs:
  - /config
  - /models
  - /images
  - /deployment
